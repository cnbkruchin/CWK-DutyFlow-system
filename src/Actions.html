<script>

/* ---------- ฟอร์มในกล่องโต้ตอบ ---------- */

/**
 * fields: [{key,label,type,value,options,required,hint,min,max,placeholder}]
 * onSubmit(values) -> Promise
 */
function formModal(title, fields, onSubmit, submitLabel) {
  var wrap = el('div', {});
  var html = '<div class="form-row">';
  fields.forEach(function (f) {
    var id = 'f_' + f.key;
    html += '<div class="field" style="' + (f.wide ? 'grid-column:1/-1' : '') + '">' +
      '<label>' + esc(f.label) + (f.required ? ' <span style="color:var(--danger)">*</span>' : '') + '</label>';
    if (f.type === 'select') {
      html += '<select class="input" id="' + id + '">' + (f.options || []).map(function (o) {
        var v = (o.value !== undefined) ? o.value : o;
        var l = (o.label !== undefined) ? o.label : o;
        return '<option value="' + esc(v) + '"' + (String(v) === String(f.value) ? ' selected' : '') + '>' +
          esc(l) + '</option>';
      }).join('') + '</select>';
    } else if (f.type === 'textarea') {
      html += '<textarea class="input" id="' + id + '" placeholder="' + esc(f.placeholder || '') + '">' +
        esc(f.value || '') + '</textarea>';
    } else {
      html += '<input class="input" id="' + id + '" type="' + (f.type || 'text') + '"' +
        (f.min !== undefined ? ' min="' + f.min + '"' : '') +
        (f.max !== undefined ? ' max="' + f.max + '"' : '') +
        (f.step !== undefined ? ' step="' + f.step + '"' : '') +
        ' value="' + esc(f.value === null || f.value === undefined ? '' : f.value) + '"' +
        ' placeholder="' + esc(f.placeholder || '') + '">';
    }
    if (f.hint) html += '<div class="hint">' + esc(f.hint) + '</div>';
    html += '</div>';
  });
  wrap.innerHTML = html + '</div><div id="formErr"></div>';

  modal({
    title: title,
    node: wrap,
    buttons: [
      { label: 'ยกเลิก', onClick: closeModal },
      {
        label: submitLabel || 'บันทึก', kind: 'btn-primary',
        onClick: function () {
          var values = {};
          var missing = [];
          fields.forEach(function (f) {
            var n = document.getElementById('f_' + f.key);
            var v = n ? n.value : '';
            values[f.key] = v;
            if (f.required && !String(v).trim()) missing.push(f.label);
          });
          if (missing.length) {
            document.getElementById('formErr').innerHTML =
              '<div class="alert alert-DANGER">กรุณากรอก: ' + esc(missing.join(', ')) + '</div>';
            return;
          }
          busy(true);
          Promise.resolve(onSubmit(values))
            .then(function () {
              busy(false); closeModal(); clearCache();
              toast('บันทึกเรียบร้อย', 'ok');
              renderView();
            })
            .catch(function (e) { busy(false); showError(e, 'บันทึกไม่สำเร็จ'); });
        }
      }
    ]
  });
}

function reasonPrompt(title, label, onOk, okLabel) {
  formModal(title, [{ key: 'reason', label: label, type: 'textarea', required: true, wide: true,
    hint: 'อย่างน้อย 5 ตัวอักษร — ข้อความนี้จะถูกบันทึกในรายงานและประวัติการใช้งาน' }],
    function (v) { return onOk(v.reason); }, okLabel || 'ยืนยัน');
}

/* ---------- GPS และภาพ ---------- */

function getGeo() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) return resolve({ lat: null, lng: null, accuracy: 0 });
    var done = false;
    var t = setTimeout(function () {
      if (!done) { done = true; resolve({ lat: null, lng: null, accuracy: 0 }); }
    }, 12000);
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (done) return;
      done = true; clearTimeout(t);
      resolve({
        lat: pos.coords.latitude, lng: pos.coords.longitude,
        accuracy: Math.round(pos.coords.accuracy || 0)
      });
    }, function () {
      if (done) return;
      done = true; clearTimeout(t);
      resolve({ lat: null, lng: null, accuracy: 0 });
    }, { enableHighAccuracy: true, timeout: 11000, maximumAge: 0 });
  });
}

/** ย่อภาพฝั่งเบราว์เซอร์ก่อนอัปโหลด เพื่อความเร็ว */
function compressImage(file, maxSide, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('อ่านไฟล์ภาพไม่สำเร็จ')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('ไฟล์นี้ไม่ใช่ภาพที่รองรับ')); };
      img.onload = function () {
        var m = maxSide || 1280;
        var w = img.width, h = img.height;
        if (w > h && w > m) { h = Math.round(h * m / w); w = m; }
        else if (h >= w && h > m) { w = Math.round(w * m / h); h = m; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ data: c.toDataURL('image/jpeg', quality || 0.72), mimeType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function pickPhotos(multiple) {
  return new Promise(function (resolve) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    if (multiple) input.multiple = true;
    input.onchange = function () {
      var files = Array.prototype.slice.call(input.files || []).slice(0, 3);
      if (!files.length) return resolve([]);
      Promise.all(files.map(function (f) { return compressImage(f); })).then(resolve);
    };
    input.click();
  });
}

          { key: 'reason', label: 'เหตุผล', type: 'textarea', required: true, wide: true,
            hint: 'อย่างน้อย 5 ตัวอักษร · จะถูกบันทึกเป็นหลักฐานการอนุมัติโดยท่าน' }
        ],
        function (v) {
          return call('schedule.adjust', {
            scheduleId: scheduleId, teacherId: v.teacherId, reason: v.reason
          });
        }, 'บันทึกการเปลี่ยน');

      var infoField = document.getElementById('f_info');
      if (infoField) { infoField.readOnly = true; infoField.style.background = '#F3F4F6'; }
    })
    .catch(function (e) { busy(false); showError(e); });
}

function openDailySwap(scheduleId, d) {
  var others = (d.rows || []).filter(function (r) { return r.id !== scheduleId; });
  if (!others.length) {
    return modal({ title: 'สลับจุด', text: 'ไม่มีที่นั่งอื่นในวันนี้ให้สลับ' });
  }
  var opts = [{ value: '', label: '— เลือกที่นั่งที่จะสลับ —' }].concat(others.map(function (r) {
    return {
      value: r.id,
      label: r.pointName + ' · ' + r.slotName + ' · ' + (r.effectiveTeacherName || '(ว่าง)')
    };
  }));

  formModal('สลับครูระหว่างสองจุด',
    [
      { key: 'b', label: 'สลับกับ', type: 'select', options: opts, required: true, wide: true },
      { key: 'reason', label: 'เหตุผล', type: 'textarea', required: true, wide: true }
    ],
    function (v) {
      return call('schedule.swap', { a: scheduleId, b: v.b, reason: v.reason });
    }, 'สลับ');
}

/* ---------- เวรของฉัน ---------- */

function bindMineActions(root) {
  root.querySelectorAll('[data-act]').forEach(function (b) {
    var act = b.getAttribute('data-act');
    var id = b.getAttribute('data-id');
    if (act === 'checkin') b.onclick = function () { doCheckin(id, 'CHECK_IN'); };
    if (act === 'checkout') b.onclick = function () { doCheckin(id, 'CHECK_OUT'); };
    if (act === 'addphoto') b.onclick = function () { doAddPhoto(id); };
    if (act === 'askswap') b.onclick = function () { openAskSwap(id); };
    if (act === 'incident') b.onclick = function () { openIncident(id); };
  });
}

function doCheckin(scheduleId, action) {
  busy(true);
  call('checkin.context', { scheduleId: scheduleId })
    .then(function (c) {
      busy(false);
      if (!c.canCheckIn) return modal({ title: 'ยังบันทึกไม่ได้', text: c.windowReason });

      var body = el('div', {});
      body.innerHTML =
        '<div class="alert alert-INFO"><div><b>' + esc(c.pointName) + '</b><br>' +
        esc(c.dateThai) + ' · ' + esc(c.slotName) + ' ' + esc(c.startTime) + '–' + esc(c.endTime) + '</div></div>' +
        '<div id="ckGeo" class="small muted">กำลังอ่านพิกัด…</div>' +
        '<div class="field mt8"><label>ภาพหลักฐาน' +
        (c.photoRequired && action === 'CHECK_IN' ? ' <span style="color:var(--danger)">*</span>' : '') +
        '</label><button class="btn btn-block" type="button" id="ckPhoto">📷 ถ่ายภาพ / เลือกภาพ</button>' +
        '<div class="thumbs" id="ckThumbs"></div>' +
        '<div class="hint">' + (c.photoRequired ? 'ต้องมีอย่างน้อย ' + c.minPhotos + ' ภาพ' : 'ไม่บังคับ') + '</div></div>' +
        '<div class="field"><label>หมายเหตุ</label><textarea class="input" id="ckNote" placeholder="ไม่บังคับ"></textarea></div>';

      var photos = [];
      var geo = { lat: null, lng: null, accuracy: 0 };

      modal({
        title: action === 'CHECK_IN' ? 'เช็คอินเข้าเวร' : 'เช็คเอาต์ออกเวร',
        node: body,
        buttons: [
          { label: 'ยกเลิก', onClick: closeModal },
          {
            label: action === 'CHECK_IN' ? 'บันทึกเข้าเวร' : 'บันทึกออกเวร', kind: 'btn-primary',
            onClick: function () {
              if (action === 'CHECK_IN' && c.photoRequired && photos.length < c.minPhotos) {
                return toast('กรุณาแนบภาพหลักฐานอย่างน้อย ' + c.minPhotos + ' ภาพ', 'err');
              }
              busy(true);
              call('checkin.submit', {
                scheduleId: scheduleId, action: action,
                lat: geo.lat, lng: geo.lng, accuracy: geo.accuracy,
                note: document.getElementById('ckNote').value,
                device: navigator.userAgent.substring(0, 110),
                idempotencyKey: scheduleId + '|' + action + '|' + Date.now(),
                photos: photos
              })
                .then(function (r) {
                  busy(false); closeModal(); clearCache();
                  toast(r.message + ' (' + r.time + ')', 'ok');
                  renderView();
                })
                .catch(function (e) { busy(false); showError(e, 'บันทึกไม่สำเร็จ'); });
            }
          }
        ]
      });

      getGeo().then(function (g) {
        geo = g;
        var n = document.getElementById('ckGeo');
        if (!n) return;
        if (g.lat === null) {
          n.innerHTML = c.gpsRequired
            ? '<span class="tag tag-warn">ไม่ได้รับพิกัด — ระบบจะบันทึกว่าไม่มีข้อมูล GPS</span>'
            : '<span class="tag tag-muted">ไม่ใช้ GPS</span>';
          return;
        }
        var dist = Math.round(haversineJs(c.pointLat, c.pointLng, g.lat, g.lng));
        var inRange = dist <= c.pointRadius;
        n.innerHTML = '<span class="tag ' + (inRange ? 'tag-ok' : 'tag-warn') + '">📍 ห่างจากจุด ' +
          nf(dist) + ' ม. (รัศมี ' + c.pointRadius + ' ม.)</span>' +
          ' <span class="muted small">ความแม่นยำ ±' + g.accuracy + ' ม.</span>';
      });

      document.getElementById('ckPhoto').onclick = function () {
        pickPhotos(true).then(function (list) {
          list.forEach(function (p) { if (photos.length < 3) photos.push(p); });
          var t = document.getElementById('ckThumbs');
          t.innerHTML = photos.map(function (p) {
            return '<img src="' + p.data + '" alt="ภาพ">';
          }).join('');
        }).catch(function (e) { toast(e.message, 'err'); });
      };
    })
    .catch(function (e) { busy(false); showError(e); });
}

function haversineJs(lat1, lng1, lat2, lng2) {
  var R = 6371000, rad = function (x) { return x * Math.PI / 180; };
  var dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function doAddPhoto(scheduleId) {
  pickPhotos(false).then(function (list) {
    if (!list.length) return;
    busy(true);
    call('checkin.addPhoto', { scheduleId: scheduleId, photo: list[0] })
      .then(function () {
        busy(false); clearCache(); toast('เพิ่มภาพหลักฐานเรียบร้อย', 'ok'); renderView();
      })
      .catch(function (e) { busy(false); showError(e); });
  }).catch(function (e) { toast(e.message, 'err'); });
}

function openAskSwap(scheduleId) {
  busy(true);
  cachedCall('teacher.options', {})

      busy(false);
      var opts = [{ value: '', label: '— เลือกครู —' }].concat(teachers.map(function (t) {
        return { value: t.id, label: t.name + (t.department ? ' · ' + t.department : '') };
      }));
      formModal('ขอเปลี่ยนเวร',

          { key: 'type', label: 'ประเภทคำขอ', type: 'select', required: true, wide: true,
            options: [{ value: 'SUBSTITUTE', label: 'ขอให้ครูท่านอื่นอยู่แทน' },
                      { value: 'EXCHANGE', label: 'ขอสลับเวรกัน' }] },
          { key: 'toTeacherId', label: 'ครูที่ต้องการ', type: 'select', options: opts, required: true, wide: true },
          { key: 'counterScheduleId', label: 'เวรของอีกฝ่ายที่จะสลับ (เฉพาะกรณีสลับเวร)', type: 'text', wide: true,
            hint: 'เว้นว่างไว้หากเลือก "ขอให้อยู่แทน" — ระบบจะช่วยตรวจสอบให้' },
          { key: 'reason', label: 'เหตุผล', type: 'textarea', required: true, wide: true }
        ],
        function (v) {
          return call('swap.create', {
            type: v.type, scheduleId: scheduleId, toTeacherId: v.toTeacherId,
            counterScheduleId: v.counterScheduleId, reason: v.reason
          });
        }, 'ส่งคำขอ');
    })
    .catch(function (e) { busy(false); showError(e); });
}

function openIncident(scheduleId) {
  busy(true);
  cachedCall('incident.options', {})

      busy(false);
      formModal('แจ้งเหตุการณ์ระหว่างอยู่เวร',
        [
          { key: 'category', label: 'ประเภท', type: 'select', options: o.categories, required: true },
          { key: 'severity', label: 'ระดับความรุนแรง', type: 'select', options: o.severities, required: true },
          { key: 'title', label: 'หัวข้อ', required: true, wide: true, hint: 'อย่างน้อย 5 ตัวอักษร' },
          { key: 'detail', label: 'รายละเอียด', type: 'textarea', required: true, wide: true, hint: 'อย่างน้อย 10 ตัวอักษร' }
        ],

          return call('incident.create', {
            scheduleId: scheduleId, category: v.category, severity: v.severity,

/* ---------- จัดเวร ---------- */

function assignFields(d, row) {
  var teachers = App.state._teachers || [];
  return [
    { key: 'weekday', label: 'วัน', type: 'select', required: true,
      value: row ? row.weekday : 1,
      options: d.weekdays.map(function (w) { return { value: w.value, label: w.label }; }) },
    { key: 'slotId', label: 'ช่วงเวลา', type: 'select', required: true,
      value: row ? row.slotId : '',
      options: d.slots.map(function (s) { return { value: s.id, label: s.name }; }) },
    { key: 'pointId', label: 'จุดเวร', type: 'select', required: true,
      value: row ? row.pointId : '',
      options: d.points.map(function (p) { return { value: p.id, label: p.name + ' (' + p.seatCount + ' ที่นั่ง)' }; }) },
    { key: 'seatNo', label: 'ที่นั่งลำดับที่', type: 'number', required: true, min: 1, max: 20,
      value: row ? row.seatNo : 1 },
    { key: 'teacherId', label: 'ครู', type: 'select', required: true,
      value: row ? row.teacherId : '', wide: true,
      options: [{ value: '', label: '— เลือกครู —' }].concat(teachers.map(function (t) {
        return { value: t.id, label: t.name + (t.department ? ' · ' + t.department : '') };
      })) },
    { key: 'rotationGroup', label: 'กลุ่มการหมุนจุด', value: row ? row.rotationGroup : '',
      hint: 'ครูจะหมุนสลับจุดเฉพาะภายในกลุ่มเดียวกัน เว้นว่างเพื่อใช้ค่าของจุดเวร' },
    { key: 'rotationOrder', label: 'ลำดับในวงหมุน', type: 'number', min: 1, max: 999,
      value: row ? row.rotationOrder : 1 },
    { key: 'rotationScope', label: 'ขอบเขตการหมุน', type: 'select', wide: true,
      value: row ? row.rotationScope : 'BOTH',
      options: [
        { value: 'BOTH', label: 'หมุนทั้งวันและจุด' },
        { value: 'DAY_ONLY', label: 'หมุนเฉพาะวัน' },
        { value: 'POINT_ONLY', label: 'หมุนเฉพาะจุด' },
        { value: 'NONE', label: 'ไม่หมุน' },
        { value: 'LOCKED', label: 'ล็อกถาวร' }
      ] }
  ];
}

function bindAssignBoard(body, d) {
  var add = document.getElementById('addAssign');
  if (add) add.onclick = function () {
    formModal('เพิ่มที่นั่งเวร', assignFields(d, null), function (v) {
      return call('assign.save', v);
    });
  };

  body.querySelectorAll('[data-act="editAssign"]').forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-id');
      var row = d.rows.filter(function (r) { return r.id === id; })[0];
      if (!row) return;
      formModal('แก้ไขที่นั่งเวร', assignFields(d, row), function (v) {
        v.id = id;
        return call('assign.save', v);
      });
    };
  });

  body.querySelectorAll('[data-act="delAssign"]').forEach(function (b) {

        '<textarea class="input" id="impText" style="min-height:150px">' + esc(t.text) + '</textarea>' +
        '<div class="hint">คอลัมน์ที่จำเป็น: ชื่อ, นามสกุล, อีเมล</div></div>' +
        '<div id="impPreview"></div>';

      modal({
        title: 'นำเข้าครูหลายรายการ',
        node: node,
        buttons: [
          { label: 'ปิด', onClick: closeModal },
          {
            label: 'ตรวจสอบข้อมูล', onClick: function () {
              busy(true);
              call('teacher.importPreview', { text: document.getElementById('impText').value })
                .then(function (p) {
                  busy(false);
                  var rows = p.rows.slice(0, 50).map(function (r) {
                    return '<tr><td class="small">' + r._line + '</td><td>' + esc(r.firstName + ' ' + r.lastName) + '</td>' +
                      '<td class="small">' + esc(r.email) + '</td><td class="small">' + esc(r.department || '') + '</td>' +
                      '<td>' + (r._errors.length ? '<span class="tag tag-danger">' + esc(r._errors.join(', ')) + '</span>' :
                        '<span class="tag tag-ok">' + (r._mode === 'UPDATE' ? 'อัปเดต' : 'เพิ่มใหม่') + '</span>') + '</td></tr>';
                  }).join('');
                  document.getElementById('impPreview').innerHTML =
                    '<div class="alert alert-INFO">ทั้งหมด ' + p.total + ' แถว · เพิ่มใหม่ ' + p.create +
                    ' · อัปเดต ' + p.update + ' · มีปัญหา ' + p.error + '</div>' +
                    '<div class="table-wrap"><table class="tb"><thead><tr><th>บรรทัด</th><th>ชื่อ</th>' +
                    '<th>อีเมล</th><th>กลุ่มสาระ</th><th>ผล</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
                  var foot = $('modalFoot');
                  if (!document.getElementById('impCommit') && (p.create + p.update) > 0) {
                    foot.appendChild(el('button', {
                      class: 'btn btn-primary', id: 'impCommit', type: 'button',
                      text: 'นำเข้า ' + (p.create + p.update) + ' รายการ',
                      onclick: function () {
                        busy(true);
                        call('teacher.importCommit', { text: document.getElementById('impText').value })
                          .then(function (r) {
                            busy(false); closeModal(); clearCache();
                            toast('นำเข้าเรียบร้อย — เพิ่ม ' + r.created + ' · อัปเดต ' + r.updated, 'ok');
                            renderView();
                          })
                          .catch(function (e) { busy(false); showError(e); });
                      }
                    }));
                  }
                })
                .catch(function (e) { busy(false); showError(e, 'ตรวจสอบข้อมูลไม่สำเร็จ'); });
            }
          }
        ]
      });
    })
    .catch(function (e) { busy(false); showError(e); });
}

function useMyLocationButton() {
  var latField = document.getElementById('f_lat');
  if (!latField || !latField.parentNode) return;
  var btn = el('button', {
    class: 'btn btn-sm mt8', type: 'button', text: '📍 ใช้พิกัดปัจจุบันของฉัน',
    onclick: function () {
      btn.textContent = 'กำลังอ่านพิกัด…';
      getGeo().then(function (g) {
        btn.textContent = '📍 ใช้พิกัดปัจจุบันของฉัน';
        if (g.lat === null) return toast('อ่านพิกัดไม่สำเร็จ กรุณาอนุญาตการเข้าถึงตำแหน่ง', 'err');
        document.getElementById('f_lat').value = g.lat.toFixed(6);
        document.getElementById('f_lng').value = g.lng.toFixed(6);
        toast('ใส่พิกัดแล้ว (±' + g.accuracy + ' ม.)', 'ok');
      });
    }
  });
  latField.parentNode.appendChild(btn);
}

/* ---------- ตั้งค่า ---------- */

function bindSettings(root) {
  var save = document.getElementById('cfgSave');
  if (save) save.onclick = function () {
    var nodes = Array.prototype.slice.call(root.querySelectorAll('.cfg'));
    busy(true);
    var chain = Promise.resolve();
    var failed = [];
    nodes.forEach(function (n) {
      chain = chain.then(function () {
        return call('config.set', { key: n.getAttribute('data-key'), value: n.value })
          .catch(function (e) { failed.push(n.getAttribute('data-key') + ': ' + e.message); });
      });
    });
    chain.then(function () {
      busy(false); clearCache();
      if (failed.length) showError(failed.join('\n'), 'บางค่าบันทึกไม่สำเร็จ');
      else toast('บันทึกการตั้งค่าเรียบร้อย', 'ok');
      refreshBoot();
    });
  };

  var d = document.getElementById('cfgDiag');
  if (d) d.onclick = function () { go('system'); };
}

/* ---------- ระบบ ---------- */

function bindSystemActions(root) {
  var r = document.getElementById('sysRefresh');
  if (r) r.onclick = function () { clearCache(); renderView(); };

  var c = document.getElementById('sysCache');
  if (c) c.onclick = function () {
    busy(true);
    call('system.clearCache', {})
      .then(function (x) { busy(false); clearCache(); toast(x.message, 'ok'); renderView(); })
      .catch(function (e) { busy(false); showError(e); });
  };

  var rp = document.getElementById('sysRepair');
  if (rp) rp.onclick = function () {
    confirmBox('ซ่อมข้อมูล',
      'ระบบจะลบรายการตารางรายวันที่อ้างถึงครู จุดเวร หรือช่วงเวลาที่ไม่มีอยู่แล้ว\n\n' +
      'รายการที่มีการเช็คอินไปแล้วจะไม่ถูกแตะต้อง\n\n' +
      'หลังซ่อมเสร็จ ให้สั่งสร้างตารางรายวันใหม่อีกครั้ง',
      function () {
        busy(true);
        call('system.repair', {})
          .then(function (x) {
            busy(false); clearCache();
            modal({ title: 'ซ่อมข้อมูลเรียบร้อย', text: x.message });
          })
          .catch(function (e) { busy(false); showError(e); });
      }, 'ซ่อมข้อมูล');
  };
}
