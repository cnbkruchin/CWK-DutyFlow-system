<script>
/* =================================================================
 * Views.html — หน้าจอทั้งหมด (8 หน้า)
 * ================================================================= */

var VIEWS = {};

/* ---------- ตัวช่วยร่วม ---------- */

function pageHead(title, sub, actionsHtml) {
  return '<div class="page-head"><div><h1 class="page-title">' + esc(title) + '</h1>' +
    (sub ? '<div class="page-sub">' + sub + '</div>' : '') + '</div>' +
    (actionsHtml ? '<div class="page-actions">' + actionsHtml + '</div>' : '') + '</div>';
}

function statCard(label, value, unit, kind) {
  return '<div class="stat ' + (kind || '') + '"><div class="stat-label">' + esc(label) + '</div>' +
    '<div class="stat-value">' + nf(value) +
    (unit ? '<span class="stat-unit">' + esc(unit) + '</span>' : '') + '</div></div>';
}

function emptyState(icon, title, text, actionsHtml) {
  return '<div class="empty"><div class="empty-icon">' + icon + '</div>' +
    '<div class="empty-title">' + esc(title) + '</div><div>' + text + '</div>' +
    (actionsHtml ? '<div class="empty-actions">' + actionsHtml + '</div>' : '') + '</div>';
}

function bar(pctVal) {
  var p = Math.max(0, Math.min(100, Number(pctVal) || 0));
  var cls = p >= 90 ? '' : (p >= 70 ? 'warn' : 'danger');
  return '<div class="flex"><div class="bar ' + cls + '" style="flex:1"><span style="width:' + p + '%"></span></div>' +
    '<span class="small nowrap">' + p + '%</span></div>';
}

function dateInput(id, value) {
  return '<input type="date" class="input" id="' + id + '" value="' + esc(value) + '">';
}

/* =================================================================
 * 1) วันนี้
 * ================================================================= */

VIEWS.today = function (root, state) {
  var date = state.date || todayStr();
  return call('today.summary', { date: date }).then(function (d) {
    App.state.today = { date: d.date };

    var head = pageHead(d.dateThai,
      (d.semesterName ? esc(d.semesterName) : '<span class="tag tag-warn">ยังไม่ได้เปิดใช้ภาคเรียน</span>') +
      (d.rotation.mode !== 'OFF' ? ' · หมุนจุด: ' + esc(d.rotation.modeLabel) : ''),
      '<button class="btn btn-sm" id="dPrev" type="button">‹ วันก่อน</button>' +
      dateInput('dPick', d.date) +
      '<button class="btn btn-sm" id="dNext" type="button">วันถัดไป ›</button>' +
      '<button class="btn btn-sm" id="dToday" type="button">วันนี้</button>');

    var html = head;

    (d.alerts || []).forEach(function (a) {
      html += '<div class="alert alert-' + a.type + '"><div class="grow">' + esc(a.text) + '</div>' +
        (a.link ? '<button class="link" type="button" data-nav="' + a.link + '">ไปที่หน้านั้น</button>' : '') +
        '</div>';
    });

    if (!d.hasSchedule) {
      html += setupOrEmptyHtml(d);
      root.innerHTML = html;
      bindTodayHead(d);
      bindSetupButtons(root);
      return;
    }

    var s = d.summary;
    html += '<div class="stat-grid">' +
      statCard('เวรทั้งหมด', s.total, 'ช่อง', 'primary') +
      statCard('อยู่ครบ', s.present, 'ช่อง', 'ok') +
      statCard('สาย / อยู่ไม่ครบ', s.late + s.partial, 'ช่อง', 'warn') +
      statCard('ไม่อยู่', s.absent, 'ช่อง', 'danger') +
      '</div>';

    html += '<div class="card"><div class="card-head">' +
      '<div><div class="card-title">เวรประจำวันทุกจุด</div>' +
      '<div class="card-sub">ใครอยู่จุดไหน อยู่จริงหรือไม่ มีหลักฐานอะไร และถ้าเปลี่ยนเวรใครอนุมัติ</div></div>' +
      '<div class="card-actions small muted">' +
      '<span class="tag tag-ok"><span class="dot dot-ok"></span>หลักฐานครบ</span> ' +
      '<span class="tag tag-warn"><span class="dot dot-warn"></span>ไม่ครบ</span> ' +
      '<span class="tag tag-danger"><span class="dot dot-danger"></span>ไม่มี</span>' +
      '</div></div><div class="card-body"><div class="duty-grid">';

    d.rows.forEach(function (r) { html += dutyCardHtml(r, d.canAdjust); });
    html += '</div></div></div>';

    root.innerHTML = html;
    bindTodayHead(d);
    bindDutyCards(root, d);
    root.querySelectorAll('[data-nav]').forEach(function (b) {
      b.onclick = function () { go(b.getAttribute('data-nav')); };
    });
  });
};

function setupOrEmptyHtml(d) {
  var setup = App.boot && App.boot.setup;
  if (setup && !setup.ready && setup.canSetup) {
    var steps = setup.steps.map(function (st, i) {
      return '<div class="step' + (st.done ? ' done' : '') + '">' +
        '<div class="step-num">' + (st.done ? '✓' : (i + 1)) + '</div>' +
        '<div class="step-label">' + esc(st.label) + '</div>' +
        '<div class="step-count">' + (st.done ? nf(st.count) + ' รายการ' : 'ยังไม่ได้ทำ') + '</div>' +
        (st.done ? '' : '<button class="btn btn-sm btn-primary" data-nav="' + st.nav + '">ไปทำ</button>') +
        '</div>';
    }).join('');
    return '<div class="card"><div class="card-head">' +
      '<div><div class="card-title">ยังตั้งค่าระบบไม่ครบ (' + setup.doneCount + '/' + setup.totalSteps + ')</div>' +
      '<div class="card-sub">ทำตามขั้นตอนด้านล่างให้ครบ แล้วหน้านี้จะแสดงตารางเวรทันที</div></div></div>' +
      '<div class="card-body"><div class="steps">' + steps + '</div>' +
      '<div class="mt16 flex"><button class="btn" type="button" id="seedSample">ใส่ข้อมูลตัวอย่างให้ทดลองใช้</button>' +
      '<button class="btn btn-ghost" type="button" data-nav="system">ตรวจสอบระบบ</button></div>' +
      '</div></div>';
  }
  if (!d.isDutyDay) {
    return '<div class="card"><div class="card-body">' +
      emptyState('🌤️', 'วันนี้ไม่มีเวร', 'วันที่เลือกเป็นวันหยุดหรือวันปิดเรียนตามปฏิทินของภาคเรียน') +
      '</div></div>';
  }
  return '<div class="card"><div class="card-body">' +
    emptyState('📭', 'ยังไม่มีตารางเวรของวันนี้',
      'ผู้ดูแลระบบต้องจัดเวรประจำภาคเรียน แล้วสั่ง "สร้างตารางรายวัน" ก่อน',
      (App.boot.user.level >= 3 ? '<button class="btn btn-primary" data-nav="assign">ไปหน้าจัดเวร</button>' : '')) +
    '</div></div>';
}

function dutyCardHtml(r, canAdjust) {
  var cls = attendClass(r.attend);
  var name = r.effectiveTeacherName || '<span class="muted">(ยังไม่ได้กำหนดครู)</span>';
  var h = '<div class="duty ' + cls + '" data-id="' + esc(r.id) + '">' +
    '<div class="duty-top"><div class="duty-point">' + esc(r.pointName || '(ไม่พบชื่อจุด)') + '</div>' +
    (r.seatNo > 1 ? '<span class="tag tag-muted">ที่ ' + r.seatNo + '</span>' : '') +
    '<span style="margin-left:auto">' + attendTag(r.attend, r.attendLabel) + '</span></div>' +
    '<div class="duty-slot">' + esc(r.slotName || '') + ' · ' + esc(r.startTime) + '–' + esc(r.endTime) + '</div>' +
    '<div class="duty-teacher">' + name + '</div>';

  if (r.changed && r.originalTeacherName) {
    h += '<div class="duty-orig">เดิม: ' + esc(r.originalTeacherName) + '</div>';
  }

  var meta = [];
  if (r.checkInAt) meta.push('⏱ เข้า ' + esc(r.checkInAt) + (r.checkOutAt ? ' · ออก ' + esc(r.checkOutAt) : ''));
  if (r.lateMinutes) meta.push('⚠ สาย ' + r.lateMinutes + ' นาที');
  if (r.distanceM !== null && r.distanceM !== undefined) meta.push('📍 ' + nf(r.distanceM) + ' ม.');
  if (r.photoCount) meta.push('📷 ' + r.photoCount + ' ภาพ');
  if (r.incidentCount) meta.push('📝 ' + r.incidentCount + ' เหตุการณ์');
  if (!meta.length) meta.push('ไม่มีหลักฐาน');
  h += '<div class="duty-meta">' + meta.map(esc).join(' ') + '</div>';
  h += '<div class="mt8">' + evidenceTag(r.evidence, r.evidenceLabel) + '</div>';

  if (r.photos && r.photos.length) {
    h += '<div class="thumbs">' + r.photos.slice(0, 4).map(function (p) {
      return '<img src="' + esc(p.url) + '" alt="หลักฐาน" loading="lazy" data-photo="' + esc(p.url) + '">';
    }).join('') + '</div>';
  }

  if (r.approval) {
    h += '<div class="duty-approval">🔁 ' + esc(r.approval.typeLabel) +
      '<br>จาก <b>' + esc(r.approval.fromName || '-') + '</b> เป็น <b>' + esc(r.approval.toName || '-') + '</b>' +
      '<br>อนุมัติโดย <b>' + esc(r.approval.approverName || '-') + '</b>' +
      ' (' + esc(r.approval.approvalLevelName || 'ไม่ระบุระดับ') + ')' +
      (r.approval.reason ? '<br>เหตุผล: ' + esc(r.approval.reason) : '') + '</div>';
  } else if (r.changed) {
    h += '<div class="duty-approval" style="background:var(--danger-bg);color:#7f1d1d">' +
      '⚠ มีการเปลี่ยนครู แต่ไม่พบบันทึกการอนุมัติ</div>';
  }

  if (canAdjust) {
    h += '<div class="duty-actions">' +
      '<button class="btn btn-sm" data-act="adjust" data-id="' + esc(r.id) + '">เปลี่ยนครูเวร</button>' +
      '<button class="btn btn-sm" data-act="swap" data-id="' + esc(r.id) + '">สลับจุด</button>' +
      '</div>';
  }
  return h + '</div>';
}

function bindTodayHead(d) {
  var p = $('dPrev'), n = $('dNext'), t = $('dToday'), pick = $('dPick');
  if (p) p.onclick = function () { go('today', { date: d.prevDate }); };
  if (n) n.onclick = function () { go('today', { date: d.nextDate }); };
  if (t) t.onclick = function () { go('today', { date: todayStr() }); };
  if (pick) pick.onchange = function () { if (pick.value) go('today', { date: pick.value }); };
}

/* =================================================================
 * 2) เวรของฉัน
 * ================================================================= */

VIEWS.mine = function (root, state) {
  var from = state.from || todayStr();
  var to = state.to || addDaysStr(from, 30);

  return call('schedule.mine', { from: from, to: to }).then(function (d) {
    var html = pageHead('เวรของฉัน', 'ตารางเวรและการบันทึกหลักฐานการปฏิบัติงาน',
      dateInput('mFrom', d.from) + '<span class="muted">ถึง</span>' + dateInput('mTo', d.to) +
      '<button class="btn btn-sm btn-primary" id="mGo" type="button">แสดง</button>');

    html += '<div class="stat-grid">' +
      statCard('เวรทั้งหมด', d.stats.total, 'ครั้ง', 'primary') +
      statCard('บันทึกแล้ว', d.stats.done, 'ครั้ง', 'ok') +
      statCard('รอปฏิบัติ', d.stats.upcoming, 'ครั้ง') +
      statCard('ยังไม่ได้บันทึก', d.stats.missed, 'ครั้ง', 'danger') +
      '</div>';

    if (!d.rows.length) {
      html += '<div class="card"><div class="card-body">' +
        emptyState('🗓️', 'ไม่มีเวรในช่วงวันที่เลือก', 'ลองขยายช่วงวันที่ หรือสอบถามหัวหน้างานเวร') +
        '</div></div>';
      root.innerHTML = html;
      bindMineHead();
      return;
    }

    html += '<div class="card"><div class="card-body"><div class="duty-grid">';
    d.rows.forEach(function (r) {
      var cls = r.checkedIn ? 'ok' : (r.isPast ? 'danger' : '');
      html += '<div class="duty ' + cls + '">' +
        '<div class="duty-top"><div class="duty-point">' + esc(r.pointName) + '</div>' +
        '<span style="margin-left:auto">' +
        (r.checkedIn ? '<span class="tag tag-ok">บันทึกแล้ว</span>' :
          (r.isPast ? '<span class="tag tag-danger">ไม่ได้บันทึก</span>' :
            '<span class="tag tag-info">รอปฏิบัติ</span>')) + '</span></div>' +
        '<div class="duty-slot">' + esc(r.dateThai) + ' · ' + esc(r.slotName) + ' ' +
        esc(r.startTime) + '–' + esc(r.endTime) + '</div>' +
        (r.substitute ? '<div class="small mt8"><span class="tag tag-warn">อยู่แทน</span></div>' : '') +
        '<div class="duty-actions">' +
        (r.isToday && !r.checkedIn ?
          '<button class="btn btn-sm btn-primary" data-act="checkin" data-id="' + esc(r.id) + '">เช็คอิน</button>' : '') +
        (r.isToday && r.checkedIn && !r.checkedOut ?
          '<button class="btn btn-sm btn-ok" data-act="checkout" data-id="' + esc(r.id) + '">เช็คเอาต์</button>' : '') +
        (r.checkedIn ?
          '<button class="btn btn-sm" data-act="addphoto" data-id="' + esc(r.id) + '">เพิ่มภาพ</button>' : '') +
        (!r.isPast ?
          '<button class="btn btn-sm" data-act="askswap" data-id="' + esc(r.id) + '">ขอเปลี่ยนเวร</button>' : '') +
        '<button class="btn btn-sm" data-act="incident" data-id="' + esc(r.id) + '">แจ้งเหตุการณ์</button>' +
        '</div></div>';
    });
    html += '</div></div></div>';

    root.innerHTML = html;
    bindMineHead();
    bindMineActions(root);
  });
};

function bindMineHead() {
  var g = $('mGo');
  if (g) g.onclick = function () {
    go('mine', { from: $('mFrom').value, to: $('mTo').value });
  };
}

/* =================================================================
 * 3) จัดเวร
 * ================================================================= */

VIEWS.assign = function (root, state) {
  var isAdmin = App.boot && App.boot.user && App.boot.user.level >= 3;
  var tabs = [
    { k: 'board', l: 'กระดานจัดเวร' },
    { k: 'pin', l: 'ปักหมุดจุดเฉพาะบุคคล' },
    { k: 'rotation', l: 'การหมุนเวร' },
    { k: 'workload', l: 'ภาระเวรรายบุคคล' }
  ];
  if (isAdmin) tabs.splice(3, 0, { k: 'generate', l: 'สร้างตารางรายวัน' });

  var tab = state.tab || 'board';
  if (!tabs.some(function (t) { return t.k === tab; })) tab = 'board';

  root.innerHTML = pageHead('จัดเวร', 'แม่แบบเวรประจำภาคเรียน การหมุนเวร และการปักหมุด') +
    '<div class="tabs">' + tabs.map(function (t) {
      return '<button class="tab' + (tab === t.k ? ' active' : '') + '" data-tab="' + t.k + '">' + t.l + '</button>';
    }).join('') + '</div><div id="assignBody"></div>';

  root.querySelectorAll('[data-tab]').forEach(function (b) {
    b.onclick = function () { go('assign', { tab: b.getAttribute('data-tab') }); };
  });

  var body = $('assignBody');
  body.innerHTML = '<div class="empty"><div class="boot-spinner"></div></div>';

  if (tab === 'board') return renderAssignBoard(body);
  if (tab === 'pin') return renderPinList(body);
  if (tab === 'rotation') return renderRotation(body);
  if (tab === 'generate') return renderGenerate(body);
  return renderWorkload(body);
};

function renderAssignBoard(body) {
  return Promise.all([
    call('assign.board', {}),
    cachedCall('teacher.options', {})
  ]).then(function (res) {
    var d = res[0], teachers = res[1];
    App.state._teachers = teachers;

    if (!d.semester) {
      body.innerHTML = '<div class="card"><div class="card-body">' +
        emptyState('📚', 'ยังไม่ได้เปิดใช้ภาคเรียน',
          'ไปที่ ข้อมูลหลัก > ภาคเรียน เพื่อสร้างและเปิดใช้ภาคเรียนก่อน',
          '<button class="btn btn-primary" data-nav="master">ไปหน้าข้อมูลหลัก</button>') +
        '</div></div>';
      bindNavButtons(body);
      return;
    }

    var html = '<div class="card"><div class="card-head">' +
      '<div><div class="card-title">' + esc(d.semester.name) + '</div>' +
      '<div class="card-sub">' + esc(d.semester.startDateThai) + ' ถึง ' + esc(d.semester.endDateThai) +
      ' · ' + nf(d.rows.length) + ' ที่นั่ง</div></div>' +
      (d.canEdit ? '<div class="card-actions">' +
        '<button class="btn btn-primary btn-sm" id="addAssign" type="button">+ เพิ่มที่นั่ง</button></div>' : '') +
      '</div><div class="card-body">';

    if (!d.rows.length) {
      html += emptyState('🪑', 'ยังไม่มีการจัดเวร',
        'กด "เพิ่มที่นั่ง" เพื่อกำหนดว่าวันไหน ช่วงเวลาใด จุดใด ใครอยู่เวร');
    } else {
      html += '<div class="table-wrap"><table class="tb"><thead><tr>' +
        '<th>วัน</th><th>ช่วงเวลา</th><th>จุดเวร</th><th class="num">ที่</th><th>ครู</th>' +
        '<th>กลุ่มสาระ</th><th>กลุ่มหมุน</th><th class="num">ลำดับ</th><th>ปักหมุด</th>' +
        (d.canEdit ? '<th></th>' : '') + '</tr></thead><tbody>';
      var slotName = {};
      d.slots.forEach(function (s) { slotName[s.id] = s.name; });
      d.rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.weekdayName) + '</td><td>' + esc(slotName[r.slotId] || '-') + '</td>' +
          '<td>' + esc(r.pointName) + '</td><td class="num">' + r.seatNo + '</td>' +
          '<td>' + esc(r.teacherName || '-') + '</td><td class="small muted">' + esc(r.department) + '</td>' +
          '<td class="small">' + esc(r.rotationGroup) + '</td><td class="num">' + r.rotationOrder + '</td>' +
          '<td>' + (r.pinMode === 'NONE' ? '<span class="muted small">—</span>' :
            '<span class="tag tag-info">' + esc(r.pinModeLabel) + '</span>') + '</td>' +
          (d.canEdit ? '<td class="nowrap">' +
            '<button class="btn btn-sm" data-act="editAssign" data-id="' + esc(r.id) + '">แก้ไข</button> ' +
            '<button class="btn btn-sm" data-act="delAssign" data-id="' + esc(r.id) + '">ลบ</button></td>' : '') +
          '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div></div>';
    body.innerHTML = html;
    App.state._board = d;
    bindAssignBoard(body, d);
  });
}

function renderPinList(body) {
  return call('pin.list', {}).then(function (d) {
    if (!d.semester) {
      body.innerHTML = '<div class="card"><div class="card-body">' +
        emptyState('📌', 'ยังไม่ได้เปิดใช้ภาคเรียน', 'กรุณาเปิดใช้ภาคเรียนก่อน') + '</div></div>';
      return;
    }
    var html = '<div class="card"><div class="card-head">' +
      '<div><div class="card-title">ปักหมุดจุดเฉพาะบุคคล</div>' +
      '<div class="card-sub">ที่นั่งที่ปักหมุดจะไม่ถูกหมุนเปลี่ยนจุด · ปักหมุดแล้ว ' +
      nf(d.summary.pinned) + ' จาก ' + nf(d.summary.total) + ' ที่นั่ง</div></div>' +
      '<div class="card-actions">' +
      (d.canEdit ? '' : '<span class="tag tag-muted">ดูได้อย่างเดียว</span>') +
      '</div></div><div class="card-body">';

    if (!d.canEdit) {
      html += '<div class="alert alert-INFO">บทบาทของท่านดูข้อมูลการปักหมุดได้ ' +
        'แต่การตั้งค่าปักหมุดสงวนไว้สำหรับหัวหน้างานเวรและผู้ดูแลระบบ</div>';
    }

    if (!d.rows.length) {
      html += emptyState('🪑', 'ยังไม่มีการจัดเวร', 'กรุณาจัดเวรในแท็บ "กระดานจัดเวร" ก่อน');
    } else {
      html += '<div class="table-wrap"><table class="tb"><thead><tr>' +
        '<th>วัน</th><th>ช่วงเวลา</th><th>จุดเวร</th><th class="num">ที่</th><th>ครู</th>' +
        '<th>กลุ่มหมุน</th><th>สถานะปักหมุด</th><th>เหตุผล</th>' +
        (d.canEdit ? '<th></th>' : '') + '</tr></thead><tbody>';
      d.rows.forEach(function (r) {
        html += '<tr><td>' + esc(r.weekdayName) + '</td><td>' + esc(r.slotName) + '</td>' +
          '<td>' + esc(r.pointName) + '</td><td class="num">' + r.seatNo + '</td>' +
          '<td>' + esc(r.teacherName || '-') + '</td><td class="small">' + esc(r.rotationGroup) + '</td>' +
          '<td>' + (r.pinMode === 'NONE' ? '<span class="muted small">ไม่ปักหมุด</span>' :
            '<span class="tag tag-info">📌 ' + esc(r.pinModeLabel) + '</span>') + '</td>' +

VIEWS.approve = function (root, state) {
  var status = state.status || 'PENDING';
  return call('swap.list', { status: status === 'ALL' ? '' : status, limit: 200 }).then(function (d) {
    var filters = [{ k: 'PENDING', l: 'รออนุมัติ' }, { k: 'APPLIED', l: 'ดำเนินการแล้ว' },
      { k: 'REJECTED', l: 'ไม่อนุมัติ' }, { k: 'ALL', l: 'ทั้งหมด' }];

    var html = pageHead('อนุมัติการเปลี่ยนเวร',
      'รออนุมัติ ' + nf(d.pending) + ' รายการ',
      filters.map(function (f) {
        return '<button class="btn btn-sm' + (status === f.k ? ' btn-primary' : '') +
          '" data-status="' + f.k + '">' + f.l + '</button>';
      }).join(''));

    if (!d.rows.length) {
      html += '<div class="card"><div class="card-body">' +
        emptyState('✅', 'ไม่มีรายการ', 'ไม่พบคำขอในสถานะที่เลือก') + '</div></div>';
    } else {
      html += '<div class="card"><div class="card-body"><div class="table-wrap"><table class="tb"><thead><tr>' +
        '<th>วันที่</th><th>จุด/ช่วงเวลา</th><th>จาก</th><th>เป็น</th><th>ประเภท</th><th>เหตุผล</th>' +
        '<th>สถานะ</th><th>ผู้อนุมัติ</th><th></th></tr></thead><tbody>';
      d.rows.forEach(function (r) {
        var stTag = { PENDING: 'tag-warn', APPLIED: 'tag-ok', APPROVED: 'tag-ok', REJECTED: 'tag-danger' }[r.status] || 'tag-muted';
        html += '<tr><td class="nowrap">' + esc(r.dateThai) + '</td>' +
          '<td class="small">' + esc(r.pointName) + '<br><span class="muted">' + esc(r.slotName) + '</span></td>' +
          '<td>' + esc(r.fromName) + '</td><td>' + esc(r.toName) + '</td>' +
          '<td class="small">' + esc(r.typeLabel) + '</td>' +
          '<td class="small">' + esc(r.reason) + '</td>' +
          '<td><span class="tag ' + stTag + '">' + esc(r.statusLabel) + '</span></td>' +
          '<td class="small">' + (r.approverName ? esc(r.approverName) + '<br><span class="muted">' +
            esc(r.approvalLevelName) + '</span>' : '<span class="muted">—</span>') + '</td>' +
          '<td class="nowrap">' +
          (r.canDecide ? '<button class="btn btn-sm btn-ok" data-act="swapOk" data-id="' + esc(r.id) + '">อนุมัติ</button> ' +
            '<button class="btn btn-sm btn-danger" data-act="swapNo" data-id="' + esc(r.id) + '">ไม่อนุมัติ</button>' : '') +
          (r.canCancel ? '<button class="btn btn-sm" data-act="swapCancel" data-id="' + esc(r.id) + '">ยกเลิก</button>' : '') +
          '</td></tr>';
      });
      html += '</tbody></table></div></div></div>';
    }

    root.innerHTML = html;
    root.querySelectorAll('[data-status]').forEach(function (b) {
      b.onclick = function () { go('approve', { status: b.getAttribute('data-status') }); };
    });
    bindApproveActions(root);
  });
};

VIEWS.report = function (root, state) {
  var tab = state.tab || 'daily';
  var tabs = [
    { k: 'daily', l: 'ปฏิบัติงานรายวัน' },
    { k: 'group', l: 'สรุปแยกกลุ่ม' },
    { k: 'evidence', l: 'หลักฐานไม่ครบ' },
    { k: 'swap', l: 'การเปลี่ยนเวร' },
    { k: 'incident', l: 'เหตุการณ์' },
    { k: 'exec', l: 'ภาพรวมผู้บริหาร' }
  ];

  root.innerHTML = pageHead('รายงาน', 'ข้อมูลการปฏิบัติงานเวรและหลักฐานประกอบ') +
    '<div class="tabs">' + tabs.map(function (t) {
      return '<button class="tab' + (tab === t.k ? ' active' : '') + '" data-tab="' + t.k + '">' + t.l + '</button>';
    }).join('') + '</div><div id="repBody"></div>';

  root.querySelectorAll('[data-tab]').forEach(function (b) {
    b.onclick = function () { go('report', { tab: b.getAttribute('data-tab') }); };
  });

  var body = $('repBody');
  body.innerHTML = '<div class="empty"><div class="boot-spinner"></div></div>';

  if (tab === 'daily') return renderReportDaily(body, state);
  if (tab === 'group') return renderReportGroup(body, state);
  if (tab === 'evidence') return renderReportEvidence(body, state);
  if (tab === 'swap') return renderReportSwap(body, state);
  if (tab === 'incident') return renderReportIncident(body, state);
  return renderReportExec(body, state);
};

VIEWS.master = function (root, state) {
  var tab = state.tab || 'teacher';
  var tabs = [
    { k: 'teacher', l: 'ครู' },
    { k: 'slot', l: 'ช่วงเวลา' },
    { k: 'point', l: 'จุดเวร' },
    { k: 'semester', l: 'ภาคเรียน' },
    { k: 'calendar', l: 'ปฏิทิน' }
  ];

  root.innerHTML = pageHead('ข้อมูลหลัก', 'ครู ช่วงเวลา จุดเวร ภาคเรียน และปฏิทิน') +
    '<div class="tabs">' + tabs.map(function (t) {
      return '<button class="tab' + (tab === t.k ? ' active' : '') + '" data-tab="' + t.k + '">' + t.l + '</button>';
    }).join('') + '</div><div id="masterBody"></div>';

  root.querySelectorAll('[data-tab]').forEach(function (b) {
    b.onclick = function () { go('master', { tab: b.getAttribute('data-tab') }); };
  });

  var body = $('masterBody');
  body.innerHTML = '<div class="empty"><div class="boot-spinner"></div></div>';

  if (tab === 'teacher') return renderTeachers(body, state);
  if (tab === 'slot') return renderSlots(body);
  if (tab === 'point') return renderPoints(body);
  if (tab === 'semester') return renderSemesters(body);
  return renderCalendar(body, state);
};

 * ================================================================= */

VIEWS.settings = function (root) {
  return Promise.all([call('config.list', {}), call('setup.status', {})]).then(function (res) {
    var groups = res[0], setup = res[1];

    var html = pageHead('ตั้งค่าระบบ', 'ค่าที่มีผลกับการทำงานของทั้งระบบ');

    if (!setup.ready) {
      html += '<div class="card"><div class="card-head"><div>' +
        '<div class="card-title">ความพร้อมของระบบ (' + setup.doneCount + '/' + setup.totalSteps + ')</div>' +
        '<div class="card-sub">ทำให้ครบเพื่อให้ระบบใช้งานได้เต็มรูปแบบ</div></div></div><div class="card-body">' +
        '<div class="steps">' + setup.steps.map(function (st, i) {
          return '<div class="step' + (st.done ? ' done' : '') + '">' +
            '<div class="step-num">' + (st.done ? '✓' : (i + 1)) + '</div>' +
            '<div class="step-label">' + esc(st.label) + '</div>' +
            '<div class="step-count">' + (st.done ? nf(st.count) : 'ยังไม่ได้ทำ') + '</div>' +
            (st.done ? '' : '<button class="btn btn-sm btn-primary" data-nav="' + st.nav + '">ไปทำ</button>') +
            '</div>';
        }).join('') + '</div>' +
        '<div class="mt16"><button class="btn" type="button" id="seedSample">ใส่ข้อมูลตัวอย่าง</button></div>' +
        '</div></div>';
    }

    groups.forEach(function (g) {
      html += '<div class="card"><div class="card-head"><div class="card-title">' + esc(g.group) + '</div></div>' +
        '<div class="card-body"><div class="form-row">';
      g.items.forEach(function (it) {
        html += '<div class="field"><label>' + esc(it.label) + '</label>';
        if (it.type === 'bool') {
          html += '<select class="input cfg" data-key="' + esc(it.key) + '">' +
            '<option value="true"' + (it.value ? ' selected' : '') + '>เปิด</option>' +
            '<option value="false"' + (!it.value ? ' selected' : '') + '>ปิด</option></select>';
        } else if (it.options) {
          html += '<select class="input cfg" data-key="' + esc(it.key) + '">' +
            it.options.map(function (o) {
              return '<option value="' + esc(o) + '"' + (o === it.value ? ' selected' : '') + '>' + esc(o) + '</option>';
            }).join('') + '</select>';
        } else if (it.type === 'number') {
          html += '<input type="number" class="input cfg" data-key="' + esc(it.key) + '" value="' + esc(it.value) + '">';
        } else {
          html += '<input class="input cfg" data-key="' + esc(it.key) + '" value="' + esc(it.value) + '">';
        }
        html += '<div class="hint">' + esc(it.key) + '</div></div>';
      });
      html += '</div></div></div>';
    });

    html += '<div class="flex mt16"><button class="btn btn-primary" id="cfgSave" type="button">บันทึกการตั้งค่าทั้งหมด</button>' +
      '<button class="btn" id="cfgDiag" type="button">ตรวจสอบระบบ</button></div>';

    root.innerHTML = html;
    bindSettings(root);
    bindSetupButtons(root);
    bindNavButtons(root);
  });
};

/* =================================================================
 * 8) ระบบ
 * ================================================================= */

VIEWS.system = function (root) {
  return call('system.selfTest', {}).then(function (d) {
    var html = pageHead('ตรวจสอบระบบ',
      'ผลการตรวจ ' + (d.ok ? '<span class="tag tag-ok">ผ่านทั้งหมด</span>' :
        '<span class="tag tag-danger">พบข้อผิดพลาด ' + d.errors + ' รายการ</span>') +
      (d.warnings ? ' <span class="tag tag-warn">คำเตือน ' + d.warnings + '</span>' : ''),
      '<button class="btn btn-sm" id="sysRefresh" type="button">ตรวจใหม่</button>' +
      '<button class="btn btn-sm" id="sysCache" type="button">ล้างแคช</button>' +
      '<button class="btn btn-sm btn-danger" id="sysRepair" type="button">ซ่อมข้อมูล</button>');

    html += '<div class="card"><div class="card-body"><div class="table-wrap"><table class="tb"><thead><tr>' +
      '<th>รายการตรวจ</th><th>ผล</th><th>รายละเอียด</th><th>วิธีแก้</th></tr></thead><tbody>';
    d.checks.forEach(function (c) {
      var tag = c.ok ? '<span class="tag tag-ok">ผ่าน</span>' :
        (c.level === 'WARN' ? '<span class="tag tag-warn">ควรตรวจ</span>' :
          '<span class="tag tag-danger">ไม่ผ่าน</span>');
      html += '<tr><td>' + esc(c.name) + '</td><td>' + tag + '</td>' +
        '<td class="small">' + esc(c.detail) + '</td>' +
        '<td class="small muted">' + (c.ok ? '' : esc(c.fix)) + '</td></tr>';
    });
    html += '</tbody></table></div></div></div>';

    html += '<div class="card"><div class="card-head"><div class="card-title">ข้อมูลผู้ใช้ปัจจุบัน</div></div>' +
      '<div class="card-body"><div class="form-row">' +
      '<div class="field"><label>อีเมล</label><div>' + esc(d.user.email) + '</div></div>' +
      '<div class="field"><label>ชื่อ</label><div>' + esc(d.user.name) + '</div></div>' +
      '<div class="field"><label>บทบาท</label><div>' + esc(d.user.roleName) + ' (' + esc(d.user.role) + ')</div></div>' +
      '<div class="field"><label>สถิติการอ่านข้อมูล</label><div class="small muted">อ่านชีต ' +
      d.stats.sheetReads + ' ครั้ง · แคช ' + d.stats.cacheHits + ' ครั้ง</div></div>' +
      '</div></div></div>';

    root.innerHTML = html;
    bindSystemActions(root);
  });
};

function bindNavButtons(scope) {
  (scope || document).querySelectorAll('[data-nav]').forEach(function (b) {
    b.onclick = function () { go(b.getAttribute('data-nav')); };
  });
}
</script>
